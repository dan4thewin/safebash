[package]
name = "sash-rt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[features]
# Emit a .profraw at exit; see src/coverage.rs. Requires the compiler-rt
# buffer objects to be folded into the archive — use `mk rt-cov`.
coverage = []

[dependencies]
rustix = { version = "1.1", default-features = false, features = ["process", "fs", "pipe", "mm", "termios", "time", "rand"] }
linux-raw-sys = { version = "0.12", default-features = false, features = ["general", "no_std"] }

[build-dependencies]
cc = "1"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
